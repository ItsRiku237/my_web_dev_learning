<!-- Topic: HTML Lists
Description: Demonstrates ordered lists (ol)-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <h1>List</h1>

    <h2>Ordered List</h2>
    <ol>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!-- Uppercase Roman Numerals: Use type="I" -->
    <ol type="I">
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!-- Lowercase Roman Numerals: Use type="i" -->
    <ol type="i">
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!-- Arabic Numerals: Use type="1" (This is the default if the type attribute is not specified) -->
    <ol type="1">
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!-- Lowercase Alphabetical Letters: Use type="a" -->
    <ol type="a">
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!-- Uppercase Alphabetical Letters: Use type="A" -->
    <ol type="A">
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>

</body>

</html>
