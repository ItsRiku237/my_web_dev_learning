<!-- Topic: HTML Lists
Description: Demonstrates unordered lists (ul)-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <h1>List</h1>
    <h2>Unordered List</h2>

    <h3>disc type' Attribute- default bullet style</h3>
    <ul type = "dish">
        <li>Mango</li>
        <li>Orange</li>
        <li>Banana</li>
    </ul>
    <h3>square type' Attribute</h3>
    <ul type ="square">
        <li>Riku</li>
        <li>suv</li>
        <li>Shibu</li>
    </ul>
    <h3>circle type' Attribute</h3>
    <ul type ="circle">
        <li>Riku</li>
        <li>suv</li>
        <li>Shibu</li>
    </ul>

</body>

</html>
