<!-- Topic: HTML Links and Bookmarks
Description: Demonstrates anchor tags, external links, and opening links in new tabs using target="_blank" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
</head>
<body>
    <h1>My Bookmark</h1>
    <h2>Primary Bookmark</h2>
    <!-- anchor tags -->
    <a href="https://www.google.com">Open Google</a>
    <a href="https://www.facebook.com">Open facebook</a>
    <a target="_blank" href="https://www.flipkart.com">Open flipkart</a>
    <!-- target ="_blank"   it give new tab for open the link. -->

    <p><a href="https://www.google.com">Open Google</a></p>
    <p><a href="https://www.facebook.com">Open facebook</a></p>
    <p><a target="_blank" href="https://www.flipkart.com">Open flipkart</a></p>

    <h2>Secondary Bookmark</h2>
    <p><a target="_blank" href="https://www.wikipedia.com">Open Wikipedia</a></p>
    <p><a href="https://www.youtube.com">Open youtube</a></p>

</body>
</html>
