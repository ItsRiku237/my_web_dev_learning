<!-- An iFrame is an HTML element that enables an inline frame for the embedding of external content. Essentially, you can load another web page within a designated area of your current webpage. -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFRAME</title>
</head>
<body>
    <!-- syntax : -->
    <!-- <iframe src="URL" width="width" height="height"></iframe> --> 
    
    <iframe src="https://archive.codewithharry.com/tutorial/html-iframes/" width="500" height="600" frameborder="1000"></iframe>
    
    <iframe src="https://archive.codewithharry.com/tutorial/html-iframes/" width="500" height="600" style="border:10px solid rgb(36, 36, 114);"></iframe>
    <!-- used CSS border (good 👍).You can remove frameborder in modern HTML: -->
</body>
</html>
