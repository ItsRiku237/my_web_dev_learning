<!-- An iFrame is an HTML element that enables an inline frame for the embedding of external content. Essentially, you can load another web page within a designated area of your current webpage. -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFRAME</title>
</head>
<body>
    <!-- syntax : -->
    <!-- <iframe src="URL" width="width" height="height"></iframe> --> 
    
    <iframe src="https://archive.codewithharry.com/tutorial/html-iframes/" width="500" height="600"></iframe>

    
    <iframe width="560" height="315" src="https://www.youtube.com/embed/X8BYu3dMKf0?si=3Z5hGOreZMvI-IlN&amp;start=315" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
