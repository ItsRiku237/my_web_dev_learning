<!DOCTYPE html>
<html lang="en">

<head>
    <title>SVG useing rect</title>
</head>

<body>
    <h2>Square using rect :</h2>
    <svg width="400" height="300">
        <rect x="10" y="20" width="100" height="100" fill="red"></rect>
    </svg>
    <!-- The SVG drawing area (canvas) is 400px wide and 300px tall. -->
    <!-- Attribute	Meaning
            x	    start from left
            y	    start from top
            width	rectangle width
            height	rectangle height -->
    <!-- Think of:
        <svg width="400" height="300"> = Drawing notebook size
        <circle>, <rect>, <polygon> = Your drawings inside the notebook
        If your notebook is small, big drawings won’t fit. -->
    <h2>Rectangle using rect</h2>
    <svg>
        <rect x="20" y="20" height="150" width="200" fill="red" />
    </svg>
    <!-- svg width/height -> Size of drawing area (canvas) -->
    <!-- rect x/y/width/height -> Position & size of rectangle -->
</body>

</html>
