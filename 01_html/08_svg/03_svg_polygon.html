<!DOCTYPE html>
<html lang="en">
<head>
    <title>SVG(POLYGON)</title>
</head>
<body>
    <!-- Any custom shape (triangle, pentagon, irregular) useing polygon -->
    <h1>Triangle useing SVG :</h1>
    <svg>
        <polygon points="50,150 150,150 100,50" fill="orange">></polygon>
    </svg>
    
    <!-- Think of the SVG like graph paper, but:
    (0, 0) is at the top-left
    X increases → to the right
    Y increases ↓ downwards (opposite of maths graph) -->

    <h1>Pentagon useing SVG :</h1>
    <svg>
        <polygon points="200,30 260,80 230,150 170,150 140,80" fill="orange" />
    </svg>
    <!-- svg width/height -> Size of drawing area (canvas) -->
    <!-- polygon points -> Shape coordinates inside SVG -->
</body>
</html>
