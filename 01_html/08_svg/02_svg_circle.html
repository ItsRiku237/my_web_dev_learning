<!DOCTYPE html>
<html lang="en">
<head>
    <title>SVG(CIRCLE)</title>
</head>
<body>
    <svg hight="100" width="100">
        <!-- synax for circle:
         <circle cx="300" cy="100" r="40" fill="purple" />
         -->
        <circle cx="50" cy="50" r="40" stroke="red" stroke_width="5" fill="green"></circle>
    </svg>
    <!-- svg width/height -> Size of drawing area (canvas)
        circle cx/cy/r -> Position & size of circle -->
        
    <!-- Attribute	Meaning
            cx	    X position of center
            cy	    Y position of center
            r	    radius
         If cx or cy is bigger than SVG width/height, the circle goes out of view. -->
            </body>
</html>
