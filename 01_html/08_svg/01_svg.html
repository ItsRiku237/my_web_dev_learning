<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG(Scalable Vector Graphics)</title>
</head>

<body>
    <svg hight="100" width="100">
        <!-- synax for circle:
         <circle cx="300" cy="100" r="40" fill="purple" />
         -->
        <circle cx="50" cy="50" r="40" stroke="red" stroke_width="5" fill="green"></circle>
    </svg>

    <svg height="100" width="100">
        <!-- syntax for polygon:
         <polygon points="50,150 150,150 100,50" fill="red" />
         -->
        <polygon points="50,150 150,150 100,50" fill="orange">
    </svg>
    <!-- Think of the SVG like graph paper, but:

    (0, 0) is at the top-left

    X increases → to the right

    Y increases ↓ downwards (opposite of maths graph) -->
    <svg>
        <polygon points="200,30 260,80 230,150 170,150 140,80" fill="orange" />
    </svg>
    <svg>
        <rect x="20" y="20" height="100" width="100" fill="red"></rect>
    </svg>
    <svg>
        <rect x="20" y="20" height="150" width="200" fill="red"></rect>
    </svg>

    <img src="02_img.svg" alt="My image">
</body>

</html>
