<!-- display characters that are reserved in HTML or that aren't readily available on the keyboard. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Entities</title>
</head>
<body>
    3>4
    <!-- &lt;  for <
         &gt;  for > -->
    This is a code for paragraph &lt;p&gt;&lt;/p&gt;

    <pre>
        <p>This is a para</p>



        this is after few line        and some more
    </pre>

</html>
