<!DOCTYPE html>
<html lang="en">

<head>
    <title>Quotation Tag</title>
</head>

<body>
    <p>
        <!-- <q> – Inline Quotation 
            Used for short quotes inside a sentence. -->
        Steve Jobs once said, <q>Stay hungry, stay foolish.</q>
    </p>

    <!-- <blockquote> – Long Quotation (Block Quote)
        Used for long quotes or paragraphs taken from another source. -->
    <blockquote cite="https://www.apple.com/stevejobs/">
        The only way to do great work is to love what you do.
        If you haven’t found it yet, keep looking. Don’t settle.
    </blockquote>

    <!-- <cite> – Citation (Source of Quote)

Used to mention who said it or the source (book, website, movie, author). -->
    <p>
        This quote is from <cite>Steve Jobs</cite>.
    </p>

    <!-- <abbr> – Abbreviation (Related concept)

        Not exactly a quotation tag, but often used in documentation with explanations. -->
    <p>
        I am learning <abbr title="HyperText Markup Language">HTML</abbr>.
    </p>

    <!-- <address> – Author / Contact Info

        Used to show author information of article or quote -->
    <address>
        Written by Rahul Kumar <br>
        Email: rahul@example.com
    </address>


</body>

</html>
