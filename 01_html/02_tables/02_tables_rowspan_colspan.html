<!-- Topic: HTML Tables
Description: Demonstrates table structure using thead, tbody, tfoot, caption, rowspan, and colspan -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <link rel="stylesheet" href="02_tables_basic_style.css">
</head>

<body>
    <table>
        <caption>Student Details</caption>
        <thead>

            <tr>
                <th>Name</th>
                <th>Designation</th>
                <th>Fav langauge</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Riku</td>
                <td>Programmer</td>
                <td>C langauge</td>
            </tr>

            <tr>
                <td>Suv</td>
                <td rowspan="2">Programmer</td>
                <td>Java</td>
            </tr>

            <tr>
                <td>Shibu</td>
                <td colspan="2">Developer</td>
                <td>Odia</td>
            </tr>
        </tbody>
        <tfoot>
            <td>Total</td>
            <td colspan="2">3</td>
        </tfoot>
    </table>

</body>

</html>
