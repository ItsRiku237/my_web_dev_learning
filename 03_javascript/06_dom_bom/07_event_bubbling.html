<!-- Event Bubbling:
Child → Parent → Grandparent

stopPropagation():
Stops event from bubbling

addEventListener():
Used to handle events

Event Object (e):
Contains event details -->

<!DOCTYPE html>
<html lang="en">

<!-- Event Bubbling:
When an event happens on a child element,
it first runs on the child, then propagates to parent elements.

Example flow:child → childContainer → container -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child {
            background-color: aqua;
            color: rgb(81, 65, 34);
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        .childContainer {
            background-color: rgb(78, 137, 137);
            color: wheat;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        .container {
            background-color: rgb(58, 89, 89);
            color: wheat;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a child.
            </div>
        </section>
    </div>
    <script>
        // Without stopPropagation()
        // Click on child:
        //         Child clicked
        //         ChildContainer clicked
        //         Container clicked

        document.querySelector(".child").addEventListener("click", (e) => {
            alert("Child was clicked..")
        })

        document.querySelector(".childContainer").addEventListener("click", (e) => {
            //Stops event from moving to parent elements , Prevents bubbling
            e.stopPropagation()
            alert("Child_container was clicked..")
        })

        // With stopPropagation() (Your Code)
        // Click on .childContainer:
        //             ChildContainer clicked
        //             It does NOT go to container

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("container was clicked..")
        })
        //e = event object ,contains information about event
    </script>
</body>

</html>
