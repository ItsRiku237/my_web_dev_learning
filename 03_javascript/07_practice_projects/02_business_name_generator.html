<!-- Create a business name generator by combining list of adjectives and shop name and another word

Adjectives:
Crazy 
Amazing
Fire 

Shop Name:
Engine
Foods
Garments

Another Word:
Bros
Limited
Hub

-->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>
    <script>
        let rand = Math.random()
        let first, second, third;
        // 0 0.33 0.66 1

        // Lets generate the first word
        if (rand < 0.33) {
            first = "Crazy";
        }
        else if (rand > 0.33 && rand < 0.66) {
            second = "Engine";
        }
        else {
            third = "Bros";
        }

        // Lets generate the second word
        rand = Math.random()
        if (rand < 0.33) {
            first = "Amazing";
        }
        else if (rand > 0.33 && rand < 0.66) {
            second = "Foods";
        }
        else {
            third = "Limited";
        }

        // Lets generate the third word
        rand = Math.random()
        if (rand < 0.33) {
            first = "Fire";
        }
        else if (rand > 0.33 && rand < 0.66) {
            second = "Garments";
        }
        else {
            third = "Hub";
        }
        console.log(first + " " + second + " " + third)
    </script>
</body>

</html>
