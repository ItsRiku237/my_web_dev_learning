<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking_Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            background-color: green;
            color: black;
            font-family: monospace, "Pliant", sans-serif;
            font-size: 25px;
            padding: 20px;
        }

        div {
            margin: 10px;
        }
    </style>
</head>

<body>
    <!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds 
    
    Initializing Hacking...
    Reading your Files...
    Password files Detected...
    Sending all passwords and personal files to server...
    Cleaning up...

    The three dots must blink so that it looks like a real terminal
    -->
    <div>Initializing Hacking...</div>
    <script>
        const addItem = async (item) => {
            await randomDelay();
            let div = document.createElement("div");
            div.innerHTML = item;
            document.body.append(div);
        }
        const randomDelay = () => {
            return new Promise((resolve, reject) => {
                timeout = 1 + 6 * Math.random(); // a + (a-b)*Math.random

                setTimeout(() => {
                    resolve()
                }, timeout * 1000);

            })
        }
        async function main() {

            // Blinking dots animation
            let blink = setInterval(() => {

                let divs = document.getElementsByTagName("div");

                if (divs.length === 0) return;

                let lastDiv = divs[divs.length - 1];

                if (lastDiv.innerHTML.endsWith("...")) {
                    lastDiv.innerHTML = lastDiv.innerHTML.slice(0, lastDiv.innerHTML.length - 3);
                }
                else {
                    lastDiv.innerHTML += ".";
                }

            }, 300);
            /*let dots = 0;

            let blink = setInterval(() => {

                let divs = document.getElementsByTagName("div");

                if (divs.length === 0) return;

                let lastDiv = divs[divs.length - 1];

                // Remove existing dots
                let text = lastDiv.innerHTML.replace(/\.*$/, "");

                // Increase dots
                dots = (dots + 1) % 4;

                // Add new dots
                lastDiv.innerHTML = text + ".".repeat(dots);

            }, 300);*/

            let text = [
                "Initialized Hacking now reading your data",
                "Reading your Files",
                "Password files Detected",
                "Sending all passwords and personal files to server",
                "Cleaning up"
            ]
            for (const item of text) {
                await addItem(item)
            }
        }
        main();
    </script>
</body>

</html>


<!--
1. getElementsByTagName("div") → Why use this?

document.body.getElementsByTagName("div")

JavaScript says: "Give me ALL divs inside body."



=> We want to animate the last message only.

1.So first we collect all divs.
2. last = last[last.length - 1]


Suppose:

last = [
  div1,
  div2,
  div3,
  div4
]

Indexes are:

0 -> div1
1 -> div2
2 -> div3
3 -> div4

Remember: length = 4 ,because there are 4 items.
Now:last.length - 1

becomes:4 - 1 =3
last[3]
returns:div4

3. slice(0, last.innerHTML.length - 3)

This is just cutting text.
Suppose:let text = "Hello..."
Length:8
Because:
H e l l o . . .
1 2 3 4 5 6 7 8

Now:text.slice(0,5)
means:Start at index 0
      Stop before index 5
Result:"Hello"

Your code:last.innerHTML.slice(0,last.innerHTML.length - 3)
Suppose:"Initializing Hacking..."
Result:"Initializing Hacking"

4. Why Promise?
Suppose I tell you:Wait 5 seconds
Then print Hello

Normal JS can't pause.

If you do:setTimeout(() => {
         console.log("Hello");
         },5000);

JS starts timer and immediately moves on.It DOES NOT wait.
Imagine:
console.log("Start");
setTimeout(()=>{
   console.log("Hello");
},5000);
console.log("End");

Output:
Start
End
Hello

Not:
Start
(wait)
Hello
End

Because JS continues running.Promise is like a "Waiting Ticket".



means:"I promise I'll tell you when this work is finished."
In your code:return new Promise((resolve,reject)=>{

means:"I'll notify you later."
Then:setTimeout(()=>{
   resolve()
},3000)

means:"After 3 seconds, tell everyone the task is complete."


5. Why async?

Suppose:
function test() {
   await randomDelay()
}
Error ❌

Because:await
works ONLY inside async functions.
So:
async function test() {
   await randomDelay()
}
Now valid ✅

Think:
Promise = Waiting Ticket
await = Wait for Ticket
async = Permission to use await

6. How do I know when to use Promise?
Use Promise when something takes time.

7. Why is addItem async?
Look:
const addItem = async (item) => {
   await randomDelay()
}
Inside addItem you wrote:await

Whenever you use : await
The function MUST be : async

"That's the rule.6" -->
