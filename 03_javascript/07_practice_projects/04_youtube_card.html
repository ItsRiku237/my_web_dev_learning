<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        body{
            background-color: #251f1f;
        }
        .card {
            display: flex;
            border: 2px solid black;
            width: 900px;
            justify-content: center;
            align-items: center;
            padding: 4px;
            background: #0c0c0c;
            margin: 4px;
        }

        .image img {
            width: 200px;
            border-radius: 12px;
        }

        .text h1 {
            padding: 0px 0 30px 13px;
            font-family: "Pliant", sans-serif;
            font-size: 28px;
            margin: 0px;
            color: azure;
        }

        .text p {
            padding: 0px 0 14px 14px;
            font-family: "Pliant", sans-serif;
            font-size: 14px;
            margin: 0px;
            color: darkgray;
        }

        .image {
            position: relative;
        }

        .capsule {
            position: absolute;
            right: 2px;
            /* z-index: 10; */
            bottom: 6px;
            background: #1f1717;
            color: white;
            opacity: 0.9;
            padding: 3px;
            border-radius: 5px;
            font-size: 14px;
            margin: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEcCPYBEIoBSFXyq4qpAw4IARUAAIhCGAFwAcABBg==&rs=AOn4CLACwWOixJVrKLFindK92kYMgTcQbw"
                    alt="">
                <div class="capsule">31:06</div>
            </div>
            <div class="text">
                <h1>Introduction to Backend | Sigma Web Dev video #2</h1>
                <p>CodeWithHarry . 727K views . 2 months ago</p>
            </div>
        </div>
    </div>
    <script src="04.js"></script>
</body>

</html>
