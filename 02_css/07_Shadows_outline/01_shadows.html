<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Shadows</title>
    <style>
        .box{
            border: 5px solid red;
            padding: 10px;
            /* box-shadow: h-offset v-offset blur spread color inset; */
            box-shadow: 6px 7px 13px 2px red;
        }
        .text-element{
            /* text-shadow: h-offset v-offset blur color; */
            text-shadow: 2px 2px 4px #888888;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Et recusandae aut accusamus! Lorem ipsum dolor sit amet, consectetur adipisicing elit. Rem impedit, porro maxime iste voluptate reiciendis possimus odit voluptatibus eum dolorem error vitae facere!
    </p>
</body>
</html>
