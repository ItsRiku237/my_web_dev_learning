<!-- There are three different ways to add CSS to an HTML page, which are:
    Inline CSS
    Internal CSS
    External CSS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS</title>
    
    <!-- Internal CSS -->
    <style>
        div{
            color: blueviolet;
            background-color: yellowgreen;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="02_style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: aquamarine; background-color: blue;">I am Riku</h1>

    <div>
       <ol>
        <li>Riku</li>
        <li>Shibu</li>
       </ol>
    </div>

    <p>Everyone is fine in someway and other are fine in other ways.</p>
</body>
</html>
