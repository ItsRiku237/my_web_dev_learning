<!DOCTYPE html>
<html lang="en">

<!--
Concepts Used:

1. Flexbox (display: flex)
2. justify-content: space-around (horizontal spacing)
3. align-items: center (vertical alignment)
4. Navbar layout design
5. Inline SVG icons
6. Gap property for spacing
7. Cursor pointer for UI interaction

Use Case:
Creating responsive website navigation bar similar to UltraEdit website.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraEdit_navbar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        nav {
            height: 12vh;
            /* width: 60vw; */
            display: flex;
            /*  justify-content: it help in copy of nav bar of UE web.*/
            justify-content: space-around;
            /* align-items: center -> it help in vertically center */
            align-items: center;
            font-family: "Segoe UI";
        }

        .logo img {
            width: 125px;
        }

        .right ul {
            display: flex;
            gap: 25px;
        }

        .right ul li {
            list-style: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .right ul li span{
            padding: 0 3px;
        }
        .right ul li img {
            height: 40px;
            width: 30px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="">
            </div>

            <div class="right">
                <ul>
                    <li>Products <span>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
                                color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg>
                        </span></li>
                    <li>Pricing <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
                                color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></span></li>
                    <li>Resources <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16"
                                height="16" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></span></li>
                    <li>About Us <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16"
                                height="16" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></span></li>
                    <li><img src="https://media.gettyimages.com/id/831648336/vector/translate-icon-vector-translation-from-japanese-to-english-flat-icon.jpg?s=612x612&w=0&k=20&c=EArygXGP2icnbN8JTe4t2ajifXp6ay8zODYLAE6AnWw="
                            alt=""></li>
                </ul>
            </div>
        </nav>
    </header>
</body>

</html>
