<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        header{
            position: sticky;
            top: 0px;
        }
        body {
            background-color: black;
        }

        nav {
            background-color: pink;
            height: 10vh;
            width: 100vw;
        }

        .big_cont {
            background-color: green;
            height: 70vh;
            margin: 10px 25px 10px 50px;
            text-align: center;
        }

        .small_cont1 {
            background-color: orange;
            height: 60vh;
            width: 40vw;
            display: inline-block;
            margin: 30px 40px 30px 55px;
        }

        .small_cont2 {
            background-color: skyblue;
            display: inline-block;
            height: 60vh;
            width: 40vw;
            margin: 30px 50px 30px 20px;
        }

        .circular_logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid orange;
            background-color: orange;
            position: fixed;
            margin-left: 1250px;
            margin-right: 1%;
        }

        .extra_cont {
            border: 2px solid wheat;
            width: 80vw;
            height: 200px;
            margin-right: 10vw;
            margin-left: 10vw;
            border-radius: 65px;
            padding: 10px;
        }
        p{
            color: aliceblue;
            text-align: center;
            font-size: 90px;
        }

        .foot {
            background-color: wheat;
            height: 15vh;
            width: 100vw;
            margin-top: 300px;
        }
    </style>
</head>

<body>
    <header>
        <nav></nav>
    </header>
    <main class="main_content">
        <div class="big_cont">
            <div class="small_cont1"></div>
            <div class="small_cont2"></div>
        </div>
        <div class="circular_logo"></div>
        <div class="extra_cont">
            <p>Welcome to Sigma Web Developement Express</p>
        </div>

    </main>
    <footer>
        <div class="foot">

        </div>
    </footer>
</body>

</html>
