<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Filters</title>
    <style>
        /* opacity() → controls transparency */
        img {
            filter: opacity(0.5);
        }

        /* Concept: grayscale() :Converts image to black and white.
            0% = normal
            100% = full grayscale */
        .img1 {
            filter: grayscale(80%);

        }

        /*
        Concept: sepia() :Adds brown vintage effect.
        */
        .img2 {
            filter: sepia(100%);

        }

        /* invert() → reverses colors  */
        .img3 {
            filter: invert(1);
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="img0" src="download.jpg" alt="">
        <img class="img1" src="download.jpg" alt="">
        <img class="img2" src="https://www.mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt="">
        <img class="img3"
            src="https://media.istockphoto.com/id/157373207/photo/balanced-stones-on-a-pebble-beach-during-sunset.jpg?s=612x612&w=0&k=20&c=V4Lua2fcDJmGiTb_JQu2EP6XmFLuAo7e3eI3cUXPNec="
            alt="">
    </div>
</body>

</html>
