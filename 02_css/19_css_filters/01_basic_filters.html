<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Filters</title>
    <style>
        /* img{
                filter: blur(5px);
                } */
        .img1 {
            filter: blur(5px);
        }

        /* Concept: brightness()
                Controls light intensity of image.
                100% = original
                200% = brighter
                50% = darker */
        .img2 {
            filter: brightness(200%);
        }

        /* Concept: Multiple filters : Multiple filters can be applied in one line. */
        .img3 {
            filter: contrast(1.8);
            filter: contrast(100%);
            filter: contrast(100%) brightness(100%) grayscale(10%);
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="img1" src="download.jpg" alt="">
        <img class="img2" src="https://www.mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt="">
        <img class="img3"
            src="https://media.istockphoto.com/id/157373207/photo/balanced-stones-on-a-pebble-beach-during-sunset.jpg?s=612x612&w=0&k=20&c=V4Lua2fcDJmGiTb_JQu2EP6XmFLuAo7e3eI3cUXPNec="
            alt="">
    </div>
</body>

</html>
