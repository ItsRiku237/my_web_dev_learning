<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Filters</title>
        <style>
            img{
                filter: blur(5px);
            }
            .img1{
                filter: brightness(200%);
            }
            .img2{
                filter: contrast(1.8);
                filter: contrast(100%);
                filter: contrast(100%) brightness(100%) grayscale(10%);
            }
            .img3{
                filter: grayscale(50%);
                filter: sepia(100%);
                filter: invert(1);
                filter: opacity(0.5);
            }
        </style>
</head>
<body>
    <div class="container">
        <img src="download.jpg" alt="">
        <img src="https://www.mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt="">
        <img src="https://media.istockphoto.com/id/157373207/photo/balanced-stones-on-a-pebble-beach-during-sunset.jpg?s=612x612&w=0&k=20&c=V4Lua2fcDJmGiTb_JQu2EP6XmFLuAo7e3eI3cUXPNec=" alt="">
    </div>
</body>
</html>
