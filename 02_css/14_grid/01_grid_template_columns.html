<!-- Concept:
        grid-template-columns
        fr unit
        repeat() -->
<!DOCTYPE html>
<html>

<head>
    <title>Grid Columns</title>
    <style>
        .container {
            border: 2px solid blue;

            display: grid;
            /* grid-template-columns: [Pehla]120px [doosra] 100px [t]; */
            /* grid-template-rows: 100px 100px 100px; */

            /* 1fr means 1 fraction of available space */
            /* Middle column takes double space */
            /* grid-template-columns: 1fr 2fr 1fr; */

            /* grid-template-columns: repeat(4 minmax(100px, 40px)); */
            /* grid-template-columns: repeat(4 minmax(100px, 1fr)); */

            /* repeat(3, 1fr) means create 3 equal columns */
            grid-template-columns: repeat(3, 1fr);
        }

        .item {
            border: 2px solid green;
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
</body>

</html>
