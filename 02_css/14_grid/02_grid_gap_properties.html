<!-- Concept:
        gap
        row-gap
        column-gap -->
<!DOCTYPE html>
<html>

<head>
    <title>Grid Gap & Alignment</title>
    <style>
        .container {
            border: 2px solid blue;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            /* This property help in taken gap b/w item */
            /* gap: 30px; */
            column-gap: 20px;
            row-gap: 10px;
        }

        .item {
            border: 2px solid green;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
    </div>
</body>

</html>
