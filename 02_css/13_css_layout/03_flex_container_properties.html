<!-- Flex Container Properties:
1. display: flex
2. justify-content (main axis alignment)
3. align-items (cross axis alignment)
4. flex-direction (row, column, reverse) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS FLEX</title>
    <style>
        .container{
            border: 2px solid rgb(163, 94, 94);
            height: 80vh;

            display: flex;

            justify-content: center;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: right;

            align-items: center;
            align-items: flex-end;
            align-items: flex-start;

            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            /* flex-direction: row-reverse; */

            align-content: center;
            align-content: flex-end;
            align-content: flex-start;
        }
        .item{
            height: 20px;
            width: 10vh;
            /* margin: 5px; */
            background-color: burlywood;
            border: 2px solid rgb(114, 93, 65);

            /* flex-grow:1; */
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item order-1">1</div>
            <div class="item item1">2</div>
            <div class="item order-3">3</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>
</html>
