<!-- Flex Item Properties:
1. order (change visual order)
2. flex-grow (grow proportionally)
3. align-self (override align-items) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS FLEX</title>
    <style>
        .container{
            border: 2px solid rgb(163, 94, 94);
            height: 80vh;

            display: flex;
        }
        .item{
            height: 20px;
            width: 10vh;
            /* margin: 5px; */
            background-color: burlywood;
            border: 2px solid rgb(114, 93, 65);

            /* flex-grow:1; */
        }
        .order-1{
            order: 1;
        }
        .order-2{
            order: 2;
        }
        .order-3{
            order: 3;
        }
        .item1{
            flex-grow:2 ;
            flex-wrap: 2;
            /* align-self: flex-end; */
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item order-1">1</div>
            <div class="item item1">2</div>
            <div class="item order-3">3</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>
</html>
