<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid gray;
            width: 800px;
            height: 50vh;
            margin: 10px;
        }

        .box1 {
            background-color: aqua;
        }

        .box2 {
            background-color: antiquewhite;
        }

        .box3 {
            background-color: rgb(44, 44, 35);
        }

        .box4 {
            background-color: burlywood;

            /*
                position: fixed →
                    Fixed relative to browser window
                    Does not move when scrolling
                */
            position: fixed;
            bottom: 0px;
            height: 30vh;
        }

        .parent {
            margin: 20px;
            padding: 10px;
            width: 900px;
            border: 2px solid blue;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
