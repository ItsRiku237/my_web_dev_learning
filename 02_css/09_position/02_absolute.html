<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid gray;
            width: 800px;
            height: 20vh;
            margin: 10px;
        }

        .box1 {
            background-color: aqua;
        }

        .box2 {
            background-color: antiquewhite;
        }

        .box3 {
            background-color: rgb(44, 44, 35);

            /* 
                position: absolute →
                    Removed from normal flow
                    Positioned relative to nearest positioned parent(nearest positioned ancesto)
                    If no positioned parent → relative to viewport '<html>'
                */
            position: absolute;
            top: 0px;
            left: 50px;
        }

        .box4 {
            background-color: burlywood;
        }

        .parent {
            margin: 20px;
            padding: 10px;
            width: 900px;
            border: 2px solid blue;

            position: absolute;
            /* position: relative; */
            /* position: sticky; */
            /* Transform, filter or perspective properties can also make anelement appear as position. */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
