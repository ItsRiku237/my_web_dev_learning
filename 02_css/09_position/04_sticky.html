<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid gray;
            width: 800px;
            height: 80vh;
            margin: 10px;
        }

        .box1 {
            background-color: aqua;
            width: 100%;
            height: 110px;
            margin: 0;
            padding: 0;

            /*
            position: sticky →
                Acts like relative until scroll threshold
                Needs top / left / right / bottom
                Works inside scrolling container
            */
            position: sticky;
            top: 10px;
        }

        .box2 {
            background-color: antiquewhite;
        }

        .box3 {
            background-color: rgb(44, 44, 35);
        }

        .box4 {
            background-color: burlywood;
        }

        .parent {
            margin: 20px;
            padding: 10px;
            width: 900px;
            border: 2px solid blue;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
