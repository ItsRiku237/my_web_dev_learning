<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        .container {
            height: 400px;
            width: 340px;
            border: 2px solid chocolate;
            background-color: azure;

        }

        img {
            height: 200px;
            width: 250px;
            border: 2px solid rgb(123, 64, 22);

        }

        .img1 {
            object-position: top right;
        }

        .img2 {
            object-position: bottom left;
        }

        .img3 {
            object-position: 20px 30px;
        }

        .img4 {
            object-position: 50% 50%;
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="img1" src="download.jpg" alt="">
        <img class="img2" src="download.jpg" alt="">
        <img class="img3" src="download.jpg" alt="">
        <img class="img4" src="download.jpg" alt="">
    </div>
</body>

</html>
