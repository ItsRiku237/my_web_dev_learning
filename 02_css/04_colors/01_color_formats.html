<!DOCTYPE html>
<html lang="en">
<head>
    <title>COLOUR</title>
    <style>
        h1{
            color: lightsalmon;
        }
        .Colour_Keyword{
            color: lightsalmon;
        }
        .Hex_color_code{
            color: #99180E;
        }
        .RGB{
            color: rgb(55, 143, 95);
        }
        .RGBA{
            color: rgba(55, 143, 95, 0.507);
        }
        .HSL{
            color: hsl(20, 10%, 43%);
        }
    </style>
</head>
<body>
    <!-- https://codepen.io/ -->
    <!-- https://codepen.io/web-dot-dev/pen/ZELGraM -->
     <h1>I am Learning Colour in CSS</h1>
     <p>
        Color can be represent in:
        <ol>
            <li class="Colour_Keyword">Colour Keyword</li>
            <li class="Hex_color_code">Hex color code</li>
            <li class="RGB">RGB</li>
            <li class="RGBA">RGBA</li>
            <li class="HSL">HSL</li>
            <!-- [Hue(h),Saturation (S),Lightness (L)] -->
        </ol>
        
     </p>
</body>
</html>
