<!DOCTYPE html>
<html>
<head>
    <title>Overflow X and Y</title>
    <style>
        .box{
            width: 200px;
            height: 80px;
            border: 2px solid green;
            overflow-x: hidden;
            overflow-y: auto;
            /* Meaning : Horizontal overflow → hidden ,Vertical overflow → scroll */
            /* overflow: hidden scroll ; */
            /* overflow: hidden auto ; */
        }
    </style>
</head>
<body>

<div class="box">
    Lorem ipsum dolor sit amet consectetur adipisicing elit.
    Lorem ipsum dolor sit amet consectetur adipisicing elit.
</div>

</body>
</html>
